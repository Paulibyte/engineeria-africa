# Nginx site for Engineeria Africa
# 2. Copy to /etc/nginx/sites-available/engineeria and enable it (see DEPLOY.md)
# 3. Run certbot to add HTTPS — it edits this file for you

server {
    listen 80;
    listen [::]:80;
    server_name engineeriaafrica.com www.engineeriaafrica.com;

    # allows video uploads up to 250 MB
    client_max_body_size 260M;

    # uploaded images, audio and video served directly by Nginx (faster)
    location /uploads/ {
        alias /var/www/engineeria/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
